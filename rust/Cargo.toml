[package]
name = "panic-demo"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "A portable reconstruction of Future Crew's Panic (1992)"
publish = false
default-run = "panic-demo"

[features]
default = ["desktop"]
desktop = ["dep:sdl2"]
hires = ["desktop", "sdl2/raw-window-handle", "dep:wgpu", "dep:pollster", "dep:bytemuck", "dep:half", "dep:png"]

[dependencies]
sdl2 = { version = "=0.38.0", optional = true, features = ["bundled", "static-link"] }
wgpu = { version = "=30.0.1", optional = true }
pollster = { version = "0.4", optional = true }
bytemuck = { version = "1.25", optional = true, features = ["derive"] }
half = { version = "2", optional = true, features = ["bytemuck"] }
png = { version = "0.18", optional = true }

[[bin]]
name = "panic-hd"
path = "src/bin/panic-hd.rs"
required-features = ["hires"]

[dev-dependencies]
sha2 = "0.10"
